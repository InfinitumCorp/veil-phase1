# VEIL upstream pin. Every release manifest records these values.
# Change them only in a reviewed commit; CI fails if they drift from the
# release manifest of the build being verified.

# Upstream Tor Browser release VEIL is based on (Firefox ESR 153 series).
TOR_BROWSER_VERSION=16.0
# Firefox ESR release under Tor Browser 16.0 (from the 16.0 changelog, Oct 29 2026).
TOR_BROWSER_ESR=153.6.0esr

# Upstream repositories. Mirrors are allowed only if they serve the same
# signed tags; bootstrap.sh verifies the tag signature either way.
TOR_BROWSER_BUILD_URL=https://gitlab.torproject.org/tpo/applications/tor-browser-build.git
TOR_BROWSER_URL=https://gitlab.torproject.org/tpo/applications/tor-browser.git

# Exact upstream tags. Resolve them on a machine that can reach
# gitlab.torproject.org, check the signers, then commit the result:
#   python3 veil-build/scripts/resolve_upstream.py
#   python3 veil-build/scripts/resolve_upstream.py --write --trust <FPR>...
# Confirmed 2026-11-06:
#   tbb-16.0-build1 -> commit eb1e8801b0ed0a73dbae383ca9328e0d9a25ca89,
#     signed by Morgan (B134686F5A2C8DCA475AB4034B60306A5EA28FAE); its
#     projects/firefox/config builds tor-browser 153.6.0esr-16.0-1 build3.
#   tor-browser-153.6.0esr-16.0-1-build3 (tag object a4d48f41e528...) ->
#     commit 1f8c6d9758e139aee1da08d170fe59a5b4580e87, signed by Pier Angelo
#     Vendrame (primary 6621290E449B26AFB029C3BFF21A8411E6B9D00F, signing
#     subkey 021CE13D28B3B67F9F7C7BC1F0756D1790128891).
# Both keys are in tor-browser-build's keyring/ (morgan.gpg, pierov.gpg).
TOR_BROWSER_BUILD_TAG=tbb-16.0-build1
TOR_BROWSER_TAG=tor-browser-153.6.0esr-16.0-1-build3

# OpenPGP fingerprints allowed to sign the upstream tags. Fill in from the
# Tor Project's published signing keys (resolve_upstream.py --trust writes
# it); bootstrap refuses an empty list.
UPSTREAM_SIGNER_FPRS="B134686F5A2C8DCA475AB4034B60306A5EA28FAE 6621290E449B26AFB029C3BFF21A8411E6B9D00F"

# VEIL branch names created on top of the pinned tags.
VEIL_BUILD_BRANCH=veil-16.0
VEIL_BROWSER_BRANCH=veil-esr153-16.0

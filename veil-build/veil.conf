# VEIL upstream pin. Every release manifest records these values.
# Change them only in a reviewed commit; CI fails if they drift from the
# release manifest of the build being verified.

# Upstream Tor Browser release VEIL is based on (Firefox ESR 153 series).
TOR_BROWSER_VERSION=16.0

# Upstream repositories. Mirrors are allowed only if they serve the same
# signed tags; bootstrap.sh verifies the tag signature either way.
TOR_BROWSER_BUILD_URL=https://gitlab.torproject.org/tpo/applications/tor-browser-build.git
TOR_BROWSER_URL=https://gitlab.torproject.org/tpo/applications/tor-browser.git

# Exact upstream tags. VERIFY AT KICKOFF against the 16.0 release announcement
# and the signed tags in each repository, then commit the confirmed values.
TOR_BROWSER_BUILD_TAG=tbb-16.0-build1
TOR_BROWSER_TAG=CHANGE-ME-confirm-16.0-tag

# OpenPGP fingerprints allowed to sign the upstream tags. Fill in from the
# Tor Project's published signing keys; bootstrap refuses an empty list.
UPSTREAM_SIGNER_FPRS=

# VEIL branch names created on top of the pinned tags.
VEIL_BUILD_BRANCH=veil-16.0
VEIL_BROWSER_BRANCH=veil-esr153-16.0

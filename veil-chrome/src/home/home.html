<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- VEIL has one workspace and it is always anonymous: every connection
       goes over Tor. Nothing on this page loads from the network; the app
       list ships inside the browser and changes only through signed updates.
       The only external action is a search the user submits themselves. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>New tab</title>
  <link rel="stylesheet" href="../shared/veil.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">VEIL&lt;/&gt;</span>
    <span class="spacer"></span>
    <nav class="top-links" aria-label="Infinitum">
      <a class="nav-link" id="mail" rel="noreferrer" hidden>Mail</a>
      <div class="apps-menu">
        <button type="button" class="nav-link" id="apps-button" aria-haspopup="true" aria-expanded="false" aria-controls="apps-panel" hidden>Apps</button>
        <div class="apps-panel" id="apps-panel" role="menu" aria-label="Infinitum apps" hidden></div>
      </div>
      <!-- Opens Cumulus://ID sign-in in a new tab, over Tor. The address comes
           from the signed app list, never from this page. -->
      <a class="signin" id="signin" rel="noreferrer" hidden>Sign In</a>
    </nav>
  </header>

  <main id="main">
    <form class="search" role="search" method="get"
          action="https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion/">
      <input id="q" name="q" type="search" placeholder="Search privately over Tor"
             autocomplete="off" spellcheck="false" aria-label="Search">
    </form>

    <div class="workspace-strip"><span class="workspace" id="workspace" title="Every connection goes over Tor. Your IP address and location stay hidden, signed in or not.">Anonymous</span></div>

    <div class="status" id="tor-status" data-state="unknown" aria-live="polite">
      <span class="status-line"><span class="dot" aria-hidden="true"></span><span id="tor-status-text">Checking Tor…</span></span>
      <button type="button" class="text-button" id="new-circuit" title="New route for the current site">New circuit</button>
      <button type="button" class="text-button" id="new-identity" title="Close all tabs and start fresh">New identity</button>
    </div>

    <nav class="bookmarks" id="bookmarks" aria-label="Bookmarks"></nav>
  </main>

  <nav class="apps" id="launcher" aria-label="Infinitum apps"></nav>
  <footer><span>AI-powered. Blockchain-governed&#8482;.</span><span class="quiet">&#169; 2026 Infinitum Corporation</span></footer>
  <script src="../shared/bridge.js"></script>
  <script src="../generated/registry.js"></script>
  <script src="home.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- VEIL has one workspace and it is always anonymous: every connection
       goes over Tor. Nothing on this page loads from the network; the app
       list ships inside the browser and changes only through signed updates.
       The only external action is a search the user submits themselves. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>New tab</title>
  <link rel="stylesheet" href="../shared/veil.css">
</head>
<body>
  <header class="topbar">
    <!-- Top left, like Google's apps menu plus Gmail and Drive: a menu of
         every Infinitum product, then Cumulus://Mail and Cumulus://Cloud. -->
    <div class="products">
      <button type="button" class="apps-button" id="apps-button"
              aria-haspopup="true" aria-expanded="false" aria-controls="launcher"
              title="Infinitum products">
        <span class="apps-grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="visually-hidden">Infinitum products</span>
      </button>
      <nav class="apps-panel" id="launcher" aria-label="Infinitum products" hidden></nav>
    </div>
    <nav class="shortcuts" id="shortcuts" aria-label="Cumulus"></nav>
    <span class="spacer"></span>
    <!-- Opens Cumulus://ID sign-in in a new tab, over Tor. The address comes
         from the signed app list, never from this page. -->
    <a class="signin" id="signin" rel="noreferrer" hidden>Sign In</a>
  </header>

  <main id="main">
    <h1 class="logo">VEIL&lt;/&gt;</h1>

    <form class="search" role="search" method="get"
          action="https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion/">
      <input id="q" name="q" type="search" placeholder="Search privately over Tor"
             autocomplete="off" spellcheck="false" aria-label="Search">
    </form>
  </main>

  <footer><span>AI-powered. Blockchain-governed&#8482;.</span><span class="quiet">&#169; 2026 Infinitum Corporation</span></footer>
  <script src="../shared/bridge.js"></script>
  <script src="../generated/registry.js"></script>
  <script src="home.js"></script>
</body>
</html>
